<div class="outer">
  <div class="container">
    <div class="row">
      <div class="offset-md-2 col-lg-5 col-md-7 offset-lg-4 offset-md-3">
        <div class="panel border bg-white">
          <div class="panel-heading">
            <h3 class="pt-3 font-weight-bold">Choose Your Taskboard</h3>
          </div>
          <div class="panel-body p-3">
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
              <div class="form-group pt-3">
                <div class="input-field"
                  [class.error]="loginForm.controls['taskboardName'].dirty && loginForm.hasError('required','taskboardName')">
                  <span class="fa fa-user p-2"></span> <input formControlName="taskboardName" type="text"
                    placeholder="Taskboard Name" required>
                </div>
              </div>
              <small *ngIf="loginForm.controls['taskboardName'].dirty && loginForm.hasError('required','taskboardName')"
                class="text-danger">*Taskboard Name is required*</small>
              <div class="form-group pt-3">
                <div class="input-field"
                  [class.error]="loginForm.controls['taskboardPassword'].dirty && loginForm.hasError('required','taskboardPassword')">
                  <span class="fa fa-lock px-2"></span> <input formControlName="taskboardPassword" [type]="type"
                    placeholder="Taskboard Password"> <button type="button" (click)="hideShowPassword()"
                    class="bg-white text-muted" style="border:none;"> <span class="fa {{eyeIcon}}"></span> </button>
                </div>
              </div>
              <small
                *ngIf="loginForm.controls['taskboardPassword'].dirty && loginForm.hasError('required','taskboardPassword')"
                class="text-danger">*Taskboard Password is required*</small>
              <button type="submit" class="btn btn-primary btn-block mt-4 w-100">See Taskboard</button>
              <div class="text-center pt-4 text-muted">Don't have a taskboard? <a id="forgot" href="#"
                  routerLink="/taskboard-creator">Create One Here</a> </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
